project:
  name: "Reliable and Grounded Vision-Language Analysis for Structured Brain Tumor MRI Report Generation"
  seed: 42

data:
  raw_dir: "data/raw"
  manifest_path: "data/manifest/manifest.csv"
  skipped_path: "data/manifest/skipped_incomplete_cases.csv"
  metadata_path: "data/manifest/slot_metadata.json"
  split_seed: 42
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  target_shape: [128, 128, 128]
  intensity_clip: [-3.0, 3.0]
  extent_quantiles: [0.333333, 0.666667]
  report_suffix: "_flair_text.txt"

slot_model:
  backbone_channels: 16
  dropout: 0.20
  epochs: 12
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  use_amp: true
  use_class_weights: true

segmentation:
  epochs: 40
  batch_size: 1
  learning_rate: 0.0002
  min_learning_rate: 0.00002
  weight_decay: 0.00001
  num_workers: 0
  use_amp: true
  channels: [8, 16, 32, 64]
  strides: [2, 2, 2]
  num_res_units: 2
  augment_probability: 0.65
  flip_probability: 0.25
  max_rotation_degrees: 10.0
  intensity_scale: 0.10
  max_grad_norm: 1.0
  scheduler_factor: 0.5
  scheduler_patience: 4
  min_epochs: 20
  early_stopping_patience: 10
  early_stopping_min_delta: 0.0001

vlm:
  llm_model: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  num_visual_tokens: 8
  vision_channels: [16, 32, 64]
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "v_proj"]
  gradient_checkpointing: true
  max_prompt_length: 512
  max_target_length: 220
  max_new_tokens: 160
  temperature: 0.0
  do_sample: false
  top_p: 0.92
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0
  grounded_target_reference_chars: 220
  epochs: 8
  batch_size: 1
  lora_learning_rate: 0.0001
  projector_learning_rate: 0.00005
  gradient_accumulation_steps: 4
  use_amp: true
  max_grad_norm: 1.0
  weight_decay: 0.01
  max_train_batches: null
  validation_every_epoch: true

rag:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_device: "cpu"  # preserve scarce 6 GB GPU VRAM for TinyLlama during VLM+RAG inference
  top_k: 3
  index_path: "data/rag_index"
  add_slot_signature: true
  query_mode: "structured_slots"
  context_chars_per_case: 120
  max_context_chars: 240
  candidate_gate: true
  max_style_cues: 3
  candidate_min_raw_conditioning: 0.90
  max_raw_conditioning_drop_vs_base: 0.02
  rag_aware_epochs: 1
  rag_aware_fraction: 0.50
  rag_aware_lora_learning_rate: 0.00002
  rag_aware_projector_learning_rate: 0.00001

paths:
  models_dir: "models"
  outputs_dir: "outputs"
  results_dir: "results"
  figures_dir: "results/figures"
  experiments_dir: "experiments"

validation:
  laterality_audit_min_agreement: 0.70
  laterality_audit_min_cases: 20
